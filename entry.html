<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartAttend Entry</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#0f172a,#2563eb);
}

.card{
    width:340px;
    background:#fff;
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
    transition:.4s;
}

.card:hover{
    transform:translateY(-8px);
}

.logo{
    font-size:28px;
    margin-bottom:10px;
}

h2{
    color:#2563eb;
    margin-bottom:20px;
}

.photo{
    width:100px;
    height:100px;
    border-radius:50%;
    margin:auto;
    overflow:hidden;
    border:4px solid #2563eb;
}

.photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.info{
    margin-top:20px;
    text-align:left;
    line-height:2;
}

.status{
    color:green;
    font-weight:bold;
}

button{
    width:100%;
    margin-top:25px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">🎓</div>

<h2>Smart Attendance</h2>

<div class="photo">
<img src="student.jpg" alt="Student">
</div>

<div class="info">
<b>Name:</b> Demo Student<br>
<b>ID:</b> CM2026<br>
<b>Department:</b> Computer Technology<br>
<b>Status:</b> <span class="status">Verified ✔</span>
</div>

<button onclick="location.href='dashboard.html'">
Enter System
</button>

</div>

</body>
</html>
